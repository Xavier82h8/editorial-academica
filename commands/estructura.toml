description = "Revisa que un documento tenga las secciones que exige su género (tesis, informe, artículo IMRyD, protocolo, revisión sistemática, ensayo, propuesta)"
prompt = """
(La raíz del plugin, `<raíz>`, es la variable de entorno EDITORIAL_ROOT o la carpeta de esta extensión, p. ej. ~/.gemini/extensions/editorial-academica.)

Corre `python <raíz>/scripts/editorial.py estructura {{args}}`. `--perfil <id>` elige el perfil de formato de la parte de maquetación (por defecto el de `.editorial.yaml`, si no `apa7`); `--listar` muestra los géneros. Si no se dio `--estructura`, deduce el género del documento (o de `.editorial.yaml`) y decláralo; si dudas, pregunta. Muestra la tabla de secciones y los hallazgos EST-xxx. Para cada sección presente, revisa además si responde las `preguntas` de `estructuras/<genero>.yaml` y lista las que no responde como observaciones (no vinculantes).

Si el documento es .docx, la salida incluye una sección «Maquetación» (EST-010 a EST-016). Trátala así:
- **EST-010 (número de página duplicado: PAGE en el encabezado y en el pie).** Pregunta con AskUserQuestion qué numeración conservar: «Encabezado, a la derecha» (APA §2.18; márcala como Recommended si el perfil es APA), «Pie» o «Ninguna». Si ninguna de las actuales coincide con lo que fija el perfil, propón la del perfil. En perfiles IEEE di que IEEE no define la numeración de páginas y que la elección es del usuario. Con la respuesta, ofrece `/editorial-academica:corregir <doc> --paginacion <elección>` (EST-011, «Página X de Y», se reduce solo al número).
- **Portada (EST-016 y el dato `maquetacion_info` / la línea «Portada: …» de la salida).** APA §2.18 (APA-008) pide número de página en todas las páginas, la portada incluida (lleva el 1); muchas instituciones lo prohíben. No es un error automático: es decisión del usuario o de la institución. Si `.editorial.yaml` ya declara `portada_numero: si|no`, no preguntes: solo informa el estado y, si EST-016 señala que lo contradice, ofrece la corrección. Si no lo declara y la portada lleva número (o EST-016 señala que no lo lleva), pregunta con AskUserQuestion «¿La portada lleva número de página?» con las opciones «Sí, el 1 (APA §2.18)» (márcala como Recommended si el perfil es APA y no hay preferencia institucional) y «No, mi institución lo pide sin número». En perfiles IEEE di que IEEE no define la numeración de la portada y no marques ninguna como Recommended. Según la respuesta, ofrece `/editorial-academica:corregir <doc> --portada-numero si|no` (con `no` la portada pasa a primera página distinta, conserva el running head y no lleva PAGE; con `si` lleva el mismo número que el resto, según `--paginacion`) y sugiere guardar la decisión como `portada_numero: si|no` en `.editorial.yaml` (con `no`, APA-008 de la portada pasa a excepción institucional en `/auditar`).
- **EST-012 a EST-014 (tablas y figuras que se parten, fila de encabezados sin repetir, encabezado pegado a una tabla).** Se corrigen con `/editorial-academica:corregir <doc>`; no hace falta preguntar.
- **EST-015 (nota de tabla o figura sin formato APA).** Muestra las plantillas de la columna «Corrección» tal cual salen, ya llenas con las citas de esa tabla, y pide al usuario que confirme la obra (o las obras) antes de reescribir la nota. No la corrijas sin esa confirmación.

Códigos de salida de los scripts: 0 sin hallazgos (o solo menores), 1 con hallazgos críticos o mayores, 2 error de uso o de entrada (archivo inexistente o no soportado, perfil desconocido o ausente, herramienta externa ausente).
"""
